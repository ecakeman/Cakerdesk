[project]
name = "cd-kernel"
version = "0.1.0"
description = "Cakerdesk kernel"
authors = [
    { name = "sancho", email = "249424373@qq.com" }
]
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28,<1",
    "langchain-openai>=0.3,<2",
    "langgraph>=1.0,<1.1",
    "langgraph-checkpoint-postgres>=2.0.21,<3",
    "psycopg[binary]>=3.2,<4",
]

[project.scripts]
cd-kernel = "cd_kernel.worker:main"

[build-system]
requires = ["uv_build>=0.12.4,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.9",
]

[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

[tool.ruff]
line-length = 100
src = ["src", "tests"]

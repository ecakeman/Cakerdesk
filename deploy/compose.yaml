services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: cakerdesk
      POSTGRES_PASSWORD: cakerdesk
      POSTGRES_DB: cakerdesk
    ports:
      - "7340:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cakerdesk -d cakerdesk"]
      interval: 5s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7
    ports:
      - "7341:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  pgdata:

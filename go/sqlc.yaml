version: "2"
sql:
  - engine: postgresql
    queries: queries/app.sql
    schema: migrations
    gen:
      go:
        package: store
        out: internal/store
        sql_package: pgx/v5
        overrides:
          - db_type: uuid
            go_type: github.com/google/uuid.UUID
          - db_type: jsonb
            go_type:
              import: encoding/json
              type: RawMessage

[project]
name = "mockllm"
version = "0.1.0"
description = "Cakerdesk Mock LLM"
authors = [
    { name = "sancho", email = "249424373@qq.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.142.1",
    "pyyaml>=6.0.3",
    "uvicorn>=0.54.0",
]

[project.scripts]
mockllm = "mockllm.app:serve"

[build-system]
requires = ["uv_build>=0.12.4,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "openai>=3.22.1",
    "pytest>=9.1.1",
    "ruff>=0.16.9",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
